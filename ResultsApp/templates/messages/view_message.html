{% extends 'base.html' %}

{% block content %}
<h3>From: {{ message.sender.get_full_name|default:message.sender.username }}</h3>
<h5>Subject: {{ message.subject }}</h5>
<p>{{ message.body }}</p>
<a href="{% url 'send_message' %}?recipient={{ message.sender.id }}" class="btn btn-primary">Reply</a>
<a href="{% url 'inbox' %}" class="btn btn-secondary">Back to Inbox</a>
{% endblock %}
