<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Notifications</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .notification {
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #007bff;
            background: #f9f9f9;
        }

        .notification.read {
            opacity: 0.6;
            border-left-color: #6c757d;
        }

        small {
            color: #777;
        }

        .actions {
            margin-top: 20px;
            text-align: right;
        }

        button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-clear {
            background: #dc3545;
            color: white;
        }

        .btn-read {
            background: #007bff;
            color: white;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Notifications</h1>

        {% if notifications %}
        {% for n in notifications %}
        <div class="notification {% if n.is_read %}read{% endif %}">
            <strong>{{ n.title|default:"Notification" }}</strong>
            <p>{{ n.message }}</p>

            <small>{{ n.timestamp|date:"M d, Y H:i" }}</small><br>

            {% if not n.is_read %}
            <button class="btn-read" onclick="markRead('{{ n.id }}')">
                Mark as read
            </button>
            {% endif %}
        </div>
        {% endfor %}

        <div class="actions">
            <button class="btn-clear" onclick="clearNotifications()">
                Clear All Notifications
            </button>
        </div>
        {% else %}
        <p>No notifications 🎉</p>
        {% endif %}
    </div>

    <script>
        // Mark a single notification as read
        function markRead(id) {
            fetch(`/notifications/read/${id}/`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        location.reload();
                    }
                });
        }

        // Clear all notifications and reset badge
        function clearNotifications() {
            fetch("/notifications/clear/", {
                method: "POST",
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Remove all notifications from page
                    document.querySelector(".container").innerHTML = "<p>No notifications 🎉</p>";
                    // Reset the badge number to 0
                    const badge = document.getElementById("notif-count");
                    if (badge) badge.textContent = "0";
                }
            });
        }
    </script>

</body>

</html>
