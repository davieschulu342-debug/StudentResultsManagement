{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5 text-center">
    <h2 class="fw-bold mb-4">Select Material Type</h2>
    <p class="text-muted mb-5">Choose Teacher or Student materials to proceed.</p>

    <div class="row justify-content-center g-4">
        <div class="col-md-3">
            <a href="{% url 'teacher_material_login' %}" class="btn btn-primary w-100 py-4 shadow-sm">
                <i class="bi bi-person-badge me-2"></i> Teacher Materials
            </a>
        </div>
        <div class="col-md-3">
            <a href="{% url 'student_material_login' %}" class="btn btn-success w-100 py-4 shadow-sm">
                <i class="bi bi-person-circle me-2"></i> Student Materials
            </a>
        </div>
    </div>
</div>
{% endblock %}
