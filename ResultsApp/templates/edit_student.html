{% extends 'admin_base.html' %}
{% load static %}

{% block content %}
<style>
    .edit-card {
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(145deg, #ffffff, #f1f4f9);
    }

    .edit-header {
        background: linear-gradient(90deg, #0d6efd, #0a58ca);
        padding: 1.2rem;
    }

    .edit-header h5 {
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .form-label {
        font-size: 0.9rem;
        color: #495057;
    }

    .form-control,
    .form-select {
        border-radius: 10px;
        padding: 0.6rem 0.75rem;
        transition: all 0.2s ease-in-out;
        margin-top: 1rem;
        margin-bottom: 1rem;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, .25);
    }

    .btn-decor {
        border-radius: 30px;
        padding: 0.45rem 1.6rem;
        font-weight: 500;
        transition: all 0.25s ease;
    }

    .btn-decor i {
        transition: transform 0.25s ease;
    }

    .btn-decor:hover i {
        transform: translateX(3px);
    }

    .btn-back {
        background-color: #f1f3f5;
        color: #495057;
    }

    .btn-back:hover {
        background-color: #e9ecef;
    }

    .btn-save {
        background: linear-gradient(90deg, #198754, #157347);
        color: #fff;
        border: none;
    }

    .btn-save:hover {
        background: linear-gradient(90deg, #157347, #146c43);
    }

    .card-body {
        padding: 2rem;
    }

    .photo-preview {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid #ddd;
        margin-bottom: 1rem;
    }
</style>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card edit-card shadow-lg border-0">

                <div class="edit-header text-white text-center">
                    <h5 class="mb-0">
                        <i class="fas fa-edit me-2"></i>Edit Student Info
                    </h5>
                </div>

                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <!-- PHOTO UPLOAD -->
                        <div class="mb-4 text-center">
    {% if student.photo %}
        <img id="photoPreview" src="{{ student.photo.url }}" alt="Student Photo" class="photo-preview">
    {% else %}
        <img id="photoPreview" src="{% static 'images/placeholder.png' %}" alt="Student Photo" class="photo-preview">
    {% endif %}

    <input type="file" name="photo" class="form-control mt-2" accept="image/*" onchange="previewPhoto(this)">
    <small class="text-muted">
        Max size: 2MB • JPG, PNG only
    </small>
</div>

                        <!-- FIRST & LAST NAME -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">First Name</label>
                            <input type="text" name="first_name" class="form-control" value="{{ student.first_name }}"
                                required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Last Name</label>
                            <input type="text" name="last_name" class="form-control" value="{{ student.last_name }}"
                                required>
                        </div>

                        <!-- CLASS -->
                        <div class="mb-3">
                            <label class="form-label">Select Class</label>
                            <select name="student_class" class="form-control">
                                {% for cls in classes %}
                                <option value="{{ cls.id }}" {% if student.student_class and student.student_class.id == cls.id %}selected{% endif %}>
                                    {{ cls.class_name }} {{ cls.numeric_name }} {{ cls.section }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- EXAM NO & PHONE -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Examination Number</label>
                            <input type="text" name="exam_no" class="form-control" value="{{ student.exam_no }}"
                                required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="text" name="phone_no" class="form-control" value="{{ student.phone_no }}"
                                required>
                        </div>

                        <!-- GENDER -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Gender</label>
                            <div>
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="gender" value="Male" {% if student.gender == "Male" %}checked{% endif %}>
                                    <label class="form-check-label">Male</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" name="gender" value="Female" {% if student.gender == "Female" %}checked{% endif %}>
                                    <label class="form-check-label">Female</label>
                                </div>
                            </div>
                        </div>

                        <!-- DISABILITY -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Disability</label>
                            <select name="disability" class="form-select">
                                <option value="none" {% if student.disability == "none" %}selected{% endif %}>None
                                </option>
                                <option value="visual" {% if student.disability == "visual" %}selected{% endif %}>Visual
                                    Impairment</option>
                                <option value="hearing" {% if student.disability == "hearing" %}selected{% endif %}>
                                    Hearing Impairment</option>
                                <option value="physical" {% if student.disability == "physical" %}selected{% endif %}>
                                    Physical Disability</option>
                                <option value="Intellectual" {% if student.disability == "Intellectual" %}selected{% endif %}>Intellectual Disability</option>
                                <option value="multiple" {% if student.disability == "multiple" %}selected{% endif %}>
                                    Multiple Disability</option>
                            </select>
                        </div>

                        <!-- DOB & ADDRESS -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Date of Birth</label>
                            <input type="date" name="dob" class="form-control" value="{{ student.dob }}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Physical Address</label>
                            <input type="text" name="address" class="form-control" value="{{ student.address }}"
                                required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Guardian/Parent Name</label>
                            <input type="text" name="parent_name" class="form-control" value="{{ student.parent_name }}"
                                required>
                        </div>

                        <!-- STATUS -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Status</label>
                            <div class="form-check form-check-inline">
                                <input type="radio" class="form-check-input" name="status" value="Active" {% if student.status == "Active" %}checked{% endif %}>
                                <label class="form-check-label">Active</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input type="radio" class="form-check-input" name="status" value="Inactive" {% if student.status == "Inactive" %}checked{% endif %}>
                                <label class="form-check-label">Inactive</label>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{% url 'manage_students' %}" class="btn btn-decor btn-back">
                                <i class="fas fa-arrow-left me-1"></i> Back
                            </a>

                            <button type="submit" class="btn btn-decor btn-save">
                                Update <i class="fas fa-check ms-1"></i>
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    function previewPhoto(input) {
        const file = input.files[0];
        const preview = document.getElementById('photoPreview');

        if (!file) return;

        // ===== SIZE LIMIT (2MB) =====
        const maxSize = 2 * 1024 * 1024; // 2MB

        if (file.size > maxSize) {
            alert("Photo size must not exceed 2MB.");
            input.value = "";
            return;
        }

        // ===== IMAGE PREVIEW =====
        const reader = new FileReader();
        reader.onload = function (e) {
            preview.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
</script>

{% endblock %}
