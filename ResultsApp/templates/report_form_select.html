{% load static %}

<form method="POST" action="{% url 'report_form_generator' %}">
    {% csrf_token %}

    <!-- Class -->
    <label>Class:</label>
    <select name="class_id" class="form-select" required>
        <option value="">-- Select Class --</option>
        {% for cls in classes %}
            <option value="{{ cls.id }}">{{ cls.class_name }} {{ cls.numeric_name }} {{ cls.section }}</option>
        {% endfor %}
    </select>

    <!-- Test Type -->
    <label>Test Type:</label>
    <select name="test_type" class="form-select" required>
        <option value="">-- Select Test Type --</option>
        {% for value, label in test_choices %}
            <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
    </select>

    <!-- Term -->
    <label>Term:</label>
    <select name="term" class="form-select" required>
        <option value="">-- Select Term --</option>
        {% for value, label in term_choices %}
            <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
    </select>

    <button type="submit" class="btn btn-success mt-3">Generate Report Forms</button>
</form>
