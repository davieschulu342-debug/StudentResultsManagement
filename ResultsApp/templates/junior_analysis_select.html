{% extends "base.html" %}

{% block extra_css %}
<style>
    /* ===== Beautified Card & Form Inputs ===== */
    .card.shadow-sm {
        border-radius: 1rem;
        background: linear-gradient(145deg, #ffffff, #f1f5f9);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        transition: all 0.3s ease;
    }

    .card.shadow-sm:hover {
        box-shadow: 0 15px 25px rgba(0,0,0,0.15);
    }

    .form-select, .form-control {
        border-radius: 0.5rem;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        transition: all 0.3s ease;
        background-color: #fff;
    }

    .form-select:hover, .form-control:hover {
        border-color: #0d6efd;
        background-color: #f8f9fa;
    }

    .form-select:focus, .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 10px rgba(13,110,253,0.2);
        outline: none;
        background-color: #fff;
    }

    label.form-label {
        font-weight: 600;
        color: #495057;
    }

    button.btn-primary {
        transition: all 0.3s ease;
    }

    button.btn-primary:hover {
        background-color: #0b5ed7;
        box-shadow: 0 5px 15px rgba(13,110,253,0.3);
    }

    h3 {
        color: #0d6efd;
        font-weight: 700;
    }

    small.text-muted {
        font-size: 0.85rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <h3 class="mb-4 text-primary fw-bold">Junior Analysis Selection</h3>

            <form method="get" action="{% url 'junior_analysis_results' %}">
                <div class="row g-3 mb-4">

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Class</label>
                        <select name="class_id" class="form-select" required>
                            <option value="">-- Select Class --</option>
                            {% for cls in classes %}
                                <option value="{{ cls.id }}">
                                    {{ cls.class_name }} {{ cls.numeric_name }} {{ cls.section }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Term</label>
                        <select name="term" class="form-select" required>
                            <option value="">-- Select Term --</option>
                            {% for t in terms %}
                                <option value="{{ t }}">{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Test</label>
                        <select name="test_type" class="form-select" required>
                            <option value="">-- Select Test --</option>
                            {% for test in tests %}
                                <option value="{{ test }}">{{ test }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Subjects</label>
                        <select name="subject_ids" class="form-select" multiple required>
                            {% for subject in subjects %}
                                <option value="{{ subject.id }}">{{ subject.subject_name }}</option>
                            {% endfor %}
                        </select>
                        <small class="text-muted d-block mt-1">
                            Hold Ctrl (Windows) or Cmd (Mac) to select multiple
                        </small>
                    </div>

                </div>

                <button class="btn btn-primary btn-lg w-100 shadow-sm">
                    <i class="fas fa-chart-bar me-2"></i> View Analysis
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
