{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Class – Report Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Generate Report Forms</h4>
        </div>

        <div class="card-body">
            <form method="post" action="{% url 'report_form_generator' %}">
                {% csrf_token %}

                <!-- Class -->
                <div class="mb-3">
                    <label class="form-label">Class</label>
                    <select name="class_id" class="form-select" required>
                        <option value="">-- Select Class --</option>
                        {% for cls in classes %}
                            <option value="{{ cls.id }}">{{ cls.class_name }} {{ cls.numeric_name }} {{ cls.section }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Term -->
                <div class="mb-3">
                    <label class="form-label">Term</label>
                    <select name="term" class="form-select" required>
                        {% for value, label in term_choices %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Test Type -->
                <div class="mb-3">
                    <label class="form-label">Test Type</label>
                    <select name="test_type" class="form-select" required>
                        <option value="">-- Select Test Type --</option>
                        {% for value, label in test_choices %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-success">Generate Report Forms (PDF)</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
