{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold">{{ level }} Materials</h2>
        <p class="text-muted">Download available materials below.</p>
    </div>

    <div class="list-group">
        {% if materials %}
            {% for material in materials %}
                <a href="{{ material.file.url }}" class="list-group-item list-group-item-action" target="_blank">
                    {{ material.title }}
                </a>
            {% endfor %}
        {% else %}
            <p class="text-muted">No materials available for this level yet.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
