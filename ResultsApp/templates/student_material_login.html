<!-- ResultsApp/templates/student_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>
    <style>
        /* ===== Reset some default styles ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6C63FF, #3F3D56);
            color: #333;
        }

        .login-container {
            background-color: #fff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
        }

        .login-container h2 {
            margin-bottom: 30px;
            color: #6C63FF;
            font-size: 28px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            text-align: left;
            font-weight: 500;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"] {
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #6C63FF;
            box-shadow: 0 0 5px rgba(108, 99, 255, 0.5);
        }

        button {
            padding: 12px;
            background-color: #6C63FF;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #574fd6;
        }

        .messages {
            margin-top: 20px;
            text-align: left;
        }

        .messages li {
            list-style: none;
            padding: 10px;
            background-color: #ffe6e6;
            color: #d8000c;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        @media (max-width: 450px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Student Login</h2>
        <form method="POST" action="">
    {% csrf_token %}
    
    <div class="mb-3">
        <label for="exam_no" class="form-label">Exam Number</label>
        <input type="text" class="form-control" id="exam_no" name="exam_no" required>
    </div>
    
    <button type="submit" class="btn btn-primary">Login</button>
</form>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-danger mt-3">{{ message }}</div>
    {% endfor %}
{% endif %}

    </div>
</body>
</html>
