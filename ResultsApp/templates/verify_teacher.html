{% extends "base.html" %}
{% block content %}
<div class="login-wrapper d-flex justify-content-center align-items-center">
    <div class="card shadow-lg p-3">
        <div class="card-body">
            <h4 class="text-center fw-bold mb-3">Verify Phone Number</h4>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <input type="text" name="phone" class="form-control mb-3" placeholder="Enter your Phone Number" required>
                <button type="submit" class="btn btn-primary w-100">Verify & Continue</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
